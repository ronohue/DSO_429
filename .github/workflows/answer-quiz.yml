name: Answer hourly quiz

on:
  schedule:
    # Every 5 minutes, offset from :00 when GitHub's scheduler is busiest.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["quiz/**", ".github/workflows/answer-quiz.yml"]

permissions:
  contents: write

concurrency:
  group: answer-quiz
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Solve new rounds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python quiz/run.py

      - name: Commit and push answers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add answers
          if git diff --cached --quiet; then
            echo "No new answers."
            exit 0
          fi
          git commit -m "Answers: $(git diff --cached --name-only | sed 's#answers/round-##; s#.json##' | paste -sd, -)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
