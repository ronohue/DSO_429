name: Answer hourly quiz

# GitHub's cron scheduler is heavily throttled (runs were landing ~2 hours
# apart), so one run polls in a loop for most of the 6-hour job limit, then
# dispatches the next run before it exits. The schedule is only a backstop
# that restarts the chain if it ever breaks.

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["quiz/**", ".github/workflows/answer-quiz.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: answer-quiz
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll, solve and push
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 335 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase origin main || true
            python quiz/run.py || echo "solver run failed; retrying next poll"
            git add answers
            if ! git diff --cached --quiet; then
              git commit -q -m "Answers: $(git diff --cached --name-only | sed 's#answers/round-##; s#.json##' | paste -sd, -)"
              for i in 1 2 3 4; do
                if git pull -q --rebase origin main && git push -q origin HEAD:main; then
                  echo "pushed $(git log -1 --format=%s)"
                  break
                fi
                sleep $((2 ** i))
              done
            fi
            sleep 120
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run answer-quiz.yml --ref main --repo "$GITHUB_REPOSITORY"
